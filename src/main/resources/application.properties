spring.application.name=baskip

# Base de donnees MySQL (voir compose.yaml)
spring.datasource.url=jdbc:mysql://localhost:3306/baskip
spring.datasource.username=baskip_user
spring.datasource.password=baskip

# Creation / mise a jour automatique des tables a partir des entites JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
